# Declarative Automation Bundle for the real-time credit card fraud detection project
bundle:
  name: fraud_detection_real_time
  engine: direct

# Load every resource definition (jobs, volumes, ...) from the resources folder
include:
  - resources/*.yml

variables:
  notification_email:
    description: Email address that receives job failure notifications
    default: manasmandal14@gmail.com

sync:
  exclude:
    - archive/**
    - setup/**
    - tests/**
    - fixtures/**
    - .vscode/**
    - .github/**
    - AGENTS.md

targets:
  # Development target: resources are prefixed with [dev <user>] and schedules are paused
  dev:
    default: true
    mode: development
    workspace:
      host: https://adb-7405610744303511.11.azuredatabricks.net
      sync_mode: overwrite
  uat:
    # UAT target: separate workspace, production-like behavior
    mode: production
    workspace:
      host: https://adb-7405604444833061.1.azuredatabricks.net
      root_path: /Workspace/Deployments/${bundle.name}/${bundle.target}
    # Jobs run as the Entra ID-managed service principal sp-prod-jobs
    run_as:
      service_principal_name: ${var.job_run_as_sp}
    permissions:
      - level: CAN_MANAGE
        user_name: sumitmandal980@gmail.com
      - level: CAN_VIEW
        service_principal_name: ${var.job_run_as_sp}
