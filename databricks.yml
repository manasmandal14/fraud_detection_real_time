# Declarative Automation Bundle for the real-time credit card fraud detection project
bundle:
  name: fraud_detection_real_time
  engine: direct

# Load every resource definition (jobs, volumes, ...) from the resources folder
include:
  - resources/*.yml

variables:
  notification_email:
    description: Email address that receives job failure notifications
    default: manasmandal14@gmail.com

sync:
  exclude:
    - archive/**
    - setup/**
    - tests/**
    - fixtures/**
    - .vscode/**
    - AGENTS.md

targets:
  # Development target: resources are prefixed with [dev <user>] and schedules are paused
  dev:
    default: true
    mode: development
    workspace:
      host: https://adb-7405613146189637.17.azuredatabricks.net
      sync_mode: overwrite
  uat:
    # UAT target: separate workspace, production-like behavior
    mode: production
    workspace:
      host: https://adb-7405608228214157.17.azuredatabricks.net
      root_path: /Workspace/Users/${workspace.current_user.userName}/.bundle/${bundle.name}/${bundle.target}
    run_as:
      service_principal_name: 6437fc33-dfdb-443c-b701-884e6a290a45
    permissions:
      - level: CAN_MANAGE
        user_name: amit1march95@gmail.com
      - level: CAN_MANAGE_RUN
        group_name: grp-fraud-detection-developers



