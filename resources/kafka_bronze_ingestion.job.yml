resources:
  jobs:
    kafka_bronze_ingestion:
      name: kafka_bronze_ingestion_job
      max_concurrent_runs: 1
      timeout_seconds: 3600
      tasks:
        - task_key: kafka_bronze_ingestion
          notebook_task:
            notebook_path: ../src/ingestion/kafka_to_bronze.py.ipynb
          max_retries: 1
          min_retry_interval_millis: 60000
      email_notifications:
        on_failure:
          - ${var.notification_email}
      tags:
        project: fraud-detection
        layer: bronze
        env: ${bundle.target}

      queue:
        enabled: true
      parameters:
        - name: env
          default: ${bundle.target}
      performance_target: PERFORMANCE_OPTIMIZED